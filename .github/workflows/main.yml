name: Build Unsigned IPA (GudaoCode, iOS 13+ arm64)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: 'latest'

    - name: Install Tuist
      run: |
        brew update
        brew install tuist
        tuist version

    - name: Generate Xcode project
      run: tuist generate --no-open

    - name: Build archive (unsigned, arm64, iOS 13.0)
      run: |
        set -e
        PROJECT_FILE=$(find . -maxdepth 1 -name "*.xcodeproj" | head -1)
        PROJECT_NAME=$(basename "$PROJECT_FILE" .xcodeproj)
        SCHEME_NAME="$PROJECT_NAME"
        echo "Project: $PROJECT_NAME, Scheme: $SCHEME_NAME"
        xcodebuild clean archive \
          -project "$PROJECT_NAME.xcodeproj" \
          -scheme "$SCHEME_NAME" \
          -configuration Release \
          -archivePath "$PWD/build/$PROJECT_NAME.xcarchive" \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          -destination generic/platform=iOS \
          ENABLE_BITCODE=NO \
          ARCHS=arm64 \
          ONLY_ACTIVE_ARCH=NO \
          IPHONEOS_DEPLOYMENT_TARGET=13.0

    - name: Package unsigned IPA
      id: package_ipa
      run: |
        set -e
        PROJECT_FILE=$(find . -maxdepth 1 -name "*.xcodeproj" | head -1)
        PROJECT_NAME=$(basename "$PROJECT_FILE" .xcodeproj)
        ARCHIVE_PATH="$PWD/build/$PROJECT_NAME.xcarchive"
        APP_BUNDLE=$(find "$ARCHIVE_PATH/Products/Applications" -name "*.app" -type d | head -1)
        if [ -z "$APP_BUNDLE" ]; then
          echo "错误：未找到 .app 包"
          exit 1
        fi
        APP_NAME=$(basename "$APP_BUNDLE" .app)

        # 确保最小系统版本为 13.0（与工程部署目标一致）
        INFO_PLIST="$APP_BUNDLE/Info.plist"
        if [ -f "$INFO_PLIST" ]; then
          /usr/libexec/PlistBuddy -c "Set :MinimumOSVersion 13.0" "$INFO_PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Add :MinimumOSVersion string 13.0" "$INFO_PLIST"
        fi

        chmod +x "$APP_BUNDLE/$APP_NAME"

        IPA_DIR="$PWD/build/ipa"
        mkdir -p "$IPA_DIR/Payload"
        cp -R "$APP_BUNDLE" "$IPA_DIR/Payload/"
        cd "$IPA_DIR"
        IPA_NAME="${PROJECT_NAME}_iOS13_arm64.ipa"
        zip -r "../$IPA_NAME" Payload
        echo "ipa_name=$IPA_NAME" >> "$GITHUB_OUTPUT"

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: gudaocode-unsigned-ipa
        path: ${{ github.workspace }}/build/*_iOS13_arm64.ipa
        retention-days: 30
